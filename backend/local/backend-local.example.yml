spring:
  datasource:
    password: change-me-db-password

app:
  governance:
    data-retention:
      enabled: false
      access-audit-retention-days: 365
      parse-failure-review-retention-days: 365
    security-headers:
      hsts-enabled: false
    transport-security:
      tls-termination-expected: false
      public-base-url: https://smart-ats.example.com
    secret-rotation:
      max-secret-age-days: 90
      jwt-secret-last-rotated-on: 2026-05-15
      internal-callback-key-last-rotated-on: 2026-05-15
  security:
    jwt:
      secret: change-me-jwt-secret-at-least-32-bytes
  internal-callback:
    api-key: change-me-internal-callback-key
  seed-default-admin:
    enabled: true
    username: admin
    password: change-me-admin-password
    email: admin@example.com
