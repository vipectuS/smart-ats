spring:
  datasource:
    url: jdbc:h2:mem:smartats;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/test-migration
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      repositories:
        enabled: false

app:
  governance:
    data-retention:
      enabled: false
      purge-cron: 0 0 3 * * *
      access-audit-retention-days: 365
      parse-failure-review-retention-days: 365
    security-headers:
      enabled: true
      hsts-enabled: false
      hsts-max-age-seconds: 31536000
      include-sub-domains: true
      content-type-options-enabled: true
      frame-options-mode: DENY
      referrer-policy: strict-origin-when-cross-origin
    transport-security:
      tls-termination-expected: false
      forwarded-headers-strategy: none
      public-base-url:
    secret-rotation:
      enabled: true
      max-secret-age-days: 90
      fail-startup-on-blocking-findings: false
      jwt-secret-last-rotated-on: 2026-05-01
      internal-callback-key-last-rotated-on: 2026-05-01
  security:
    jwt:
      secret: test-secret-key-that-is-safely-long-enough-for-hmac-256
      expiration-minutes: 30
  embedding:
    dimension: 1536
    ai-service-base-url: http://127.0.0.1:18081
    embedding-path: /api/embeddings
    job-fit-report-path: /api/job-fit-report
    native-vector-storage-enabled: false
    pgvector-query-enabled: false
  internal-callback:
    header-name: X-Internal-Api-Key
    api-key: test-internal-callback-key
  resume-queue:
    channel: resume.parse.requests.test
    listener-enabled: false
    mock-processing-delay-millis: 1

server:
  forward-headers-strategy: none