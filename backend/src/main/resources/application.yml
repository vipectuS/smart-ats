spring:
  application:
    name: smart-ats-backend
  config:
    import: optional:file:./local/backend-local.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:smart_ats}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:change-me-db-password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      repositories:
        enabled: false

app:
  governance:
    data-retention:
      enabled: ${GOVERNANCE_DATA_RETENTION_ENABLED:false}
      purge-cron: ${GOVERNANCE_DATA_RETENTION_PURGE_CRON:0 0 3 * * *}
      access-audit-retention-days: ${GOVERNANCE_ACCESS_AUDIT_RETENTION_DAYS:365}
      parse-failure-review-retention-days: ${GOVERNANCE_PARSE_FAILURE_REVIEW_RETENTION_DAYS:365}
    security-headers:
      enabled: ${GOVERNANCE_SECURITY_HEADERS_ENABLED:true}
      hsts-enabled: ${GOVERNANCE_SECURITY_HEADERS_HSTS_ENABLED:false}
      hsts-max-age-seconds: ${GOVERNANCE_SECURITY_HEADERS_HSTS_MAX_AGE_SECONDS:31536000}
      include-sub-domains: ${GOVERNANCE_SECURITY_HEADERS_INCLUDE_SUB_DOMAINS:true}
      content-type-options-enabled: ${GOVERNANCE_SECURITY_HEADERS_CONTENT_TYPE_OPTIONS_ENABLED:true}
      frame-options-mode: ${GOVERNANCE_SECURITY_HEADERS_FRAME_OPTIONS_MODE:DENY}
      referrer-policy: ${GOVERNANCE_SECURITY_HEADERS_REFERRER_POLICY:strict-origin-when-cross-origin}
    transport-security:
      tls-termination-expected: ${GOVERNANCE_TLS_TERMINATION_EXPECTED:false}
      forwarded-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
      public-base-url: ${PUBLIC_BASE_URL:}
    secret-rotation:
      enabled: ${GOVERNANCE_SECRET_ROTATION_ENABLED:true}
      max-secret-age-days: ${GOVERNANCE_SECRET_ROTATION_MAX_SECRET_AGE_DAYS:90}
      fail-startup-on-blocking-findings: ${GOVERNANCE_SECRET_ROTATION_FAIL_STARTUP_ON_BLOCKING_FINDINGS:false}
      jwt-secret-last-rotated-on: ${GOVERNANCE_JWT_SECRET_LAST_ROTATED_ON:}
      internal-callback-key-last-rotated-on: ${GOVERNANCE_INTERNAL_CALLBACK_KEY_LAST_ROTATED_ON:}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-jwt-secret-at-least-32-bytes}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  embedding:
    dimension: ${EMBEDDING_DIMENSION:1536}
    ai-service-base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
    embedding-path: ${AI_SERVICE_EMBEDDING_PATH:/api/embeddings}
    job-fit-report-path: ${AI_SERVICE_JOB_FIT_REPORT_PATH:/api/job-fit-report}
    request-timeout-millis: ${EMBEDDING_REQUEST_TIMEOUT_MILLIS:5000}
    native-vector-storage-enabled: ${EMBEDDING_NATIVE_VECTOR_STORAGE_ENABLED:true}
    pgvector-query-enabled: ${EMBEDDING_PGVECTOR_QUERY_ENABLED:true}
  internal-callback:
    header-name: ${INTERNAL_CALLBACK_HEADER_NAME:X-Internal-Api-Key}
    api-key: ${INTERNAL_CALLBACK_API_KEY:change-me-internal-callback-key}
  resume-queue:
    channel: ${RESUME_QUEUE_CHANNEL:resume.parse.requests}
    listener-enabled: ${RESUME_QUEUE_LISTENER_ENABLED:false}
    mock-processing-delay-millis: ${RESUME_QUEUE_MOCK_DELAY_MS:250}
  seed-default-admin:
    enabled: ${SEED_DEFAULT_ADMIN_ENABLED:false}
    username: ${SEED_DEFAULT_ADMIN_USERNAME:admin}
    password: ${SEED_DEFAULT_ADMIN_PASSWORD:change-me-admin-password}
    email: ${SEED_DEFAULT_ADMIN_EMAIL:admin@example.com}

server:
  port: 18080
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

